<title>SCRIPTURE UNFOLDS — The Scrolls, Scene by Scene</title>
<style>
  :root{ --gold:#d4af37; --gold-lt:#f1d573; --ink:#f4ead5; --dim:#c9b893; --bg:#0b0806; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg);
    font-family:"Cardo","EB Garamond",Georgia,'Times New Roman',serif; color:var(--ink);
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #cv{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* ---------------- THE OPENING ---------------- */
  #boot{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(ellipse at 50% 38%, #1f1710 0%, #0b0806 72%); padding:4vh 6vw 16vh; }
  #boot svg{ width:clamp(96px,17vmin,150px); filter:drop-shadow(0 0 26px rgba(212,175,55,.3)); }
  #boot h1{ margin-top:2.2vh; font-size:clamp(20px,4.4vmin,40px); letter-spacing:.32em;
    color:var(--gold); text-indent:.32em; text-shadow:0 0 30px rgba(212,175,55,.35); }
  #boot .sub{ margin-top:1vh; font-style:italic; color:var(--dim); font-size:clamp(11px,1.8vmin,15px); }
  #load-stage{ margin-top:4vh; font-size:clamp(10px,1.55vmin,13px); letter-spacing:.24em;
    text-transform:uppercase; color:#9a8f74; min-height:1.4em; }
  #load-bar{ margin-top:1.3vh; width:min(72vw,360px); height:7px; border:1px solid rgba(212,175,55,.55);
    border-radius:4px; background:rgba(20,14,10,.9); overflow:hidden; }
  #load-fill{ height:100%; width:0%; border-radius:3px; transition:width .35s ease;
    background:linear-gradient(90deg,#6b5418,var(--gold),#fff3b8,var(--gold),#6b5418);
    background-size:200% 100%; animation:sheen 2.4s linear infinite; }
  @keyframes sheen{ from{ background-position:0% 0; } to{ background-position:200% 0; } }
  #load-fail{ display:none; margin-top:2.4vh; max-width:min(86vw,540px); color:#c98a6a;
    font-size:clamp(10px,1.6vmin,13px); line-height:1.7; }
  #boot-verse{ position:absolute; left:50%; bottom:5vh; transform:translateX(-50%);
    width:min(86vw,660px); text-align:center; }
  #bv-inner{ transition:opacity .5s ease; }
  #bv-t{ font-style:italic; color:var(--dim); font-size:clamp(11px,1.85vmin,15px); line-height:1.65; }
  #bv-r{ margin-top:.8vh; font-size:clamp(9px,1.4vmin,12px); letter-spacing:.28em; color:var(--gold); }

  /* ---------------- THE SHELF OF SCROLLS ---------------- */
  #shelf{ position:fixed; inset:0; z-index:38; display:none; }
  #shelf-col{ position:absolute; left:0; top:0; bottom:0; width:min(90vw,460px);
    display:flex; flex-direction:column; justify-content:center; padding:16vh 3vw 10vh;
    background:linear-gradient(90deg, rgba(11,8,6,.95) 0%, rgba(11,8,6,.7) 60%, rgba(11,8,6,0) 100%); }
  #shelf-logo{ position:absolute; top:4.4vh; left:3vw; display:flex; align-items:center; gap:1.4vmin; }
  #shelf-logo svg{ width:clamp(44px,7vmin,62px); filter:drop-shadow(0 0 14px rgba(212,175,55,.3)); }
  #shelf-logo .t{ font-size:clamp(14px,2.4vmin,22px); letter-spacing:.28em; color:var(--gold); }
  #shelf-logo .s{ margin-top:.5vh; font-size:clamp(8px,1.25vmin,11px); font-style:italic; color:#9a8f74; }
  .sc-item{ pointer-events:auto; display:block; width:100%; text-align:left; background:transparent;
    color:var(--ink); border:1px solid transparent; border-radius:3px; padding:1.4vh 1.7vh;
    font-family:inherit; cursor:pointer; transition:all .15s; }
  .sc-item .n{ font-size:clamp(12px,2vmin,17px); letter-spacing:.2em; text-transform:uppercase; }
  .sc-item .r{ margin-top:.5vh; font-size:clamp(9px,1.45vmin,12px); font-style:italic; color:#9a8f74; }
  .sc-item.sel{ border-color:var(--gold); background:rgba(212,175,55,.1); }
  .sc-item.sel .n{ color:#fff; text-shadow:0 0 12px rgba(212,175,55,.5); }
  #shelf-hint{ position:absolute; left:3vw; bottom:3.2vh; font-size:clamp(9px,1.4vmin,12px);
    letter-spacing:.2em; color:#8b8271; }

  /* ---------------- A SCENE ON THE SCREEN ---------------- */
  #sc-cine{ position:fixed; inset:0; z-index:20; pointer-events:none; opacity:0; transition:opacity .9s ease; }
  #sc-cine.on{ opacity:1; }
  #sc-cine .bar{ position:absolute; left:0; right:0; height:12vh; background:#070504; }
  #sc-cine .bar.t{ top:0; } #sc-cine .bar.b{ bottom:0; }
  #sc-cap{ position:fixed; z-index:22; left:8vw; right:8vw; bottom:16vh; text-align:center;
    pointer-events:none; opacity:0; transition:opacity 1s ease; }
  #sc-cap.on{ opacity:1; }
  #sc-cap-t{ font-style:italic; color:#f4ead5; font-size:clamp(13px,2.35vmin,22px); line-height:1.72;
    text-shadow:0 2px 16px rgba(0,0,0,.95); }
  #sc-cap-r{ margin-top:1.1vh; font-size:clamp(9px,1.45vmin,12px); letter-spacing:.28em; color:var(--gold);
    text-shadow:0 2px 10px rgba(0,0,0,.9); }
  #sc-fade{ position:fixed; inset:0; z-index:23; pointer-events:none; background:#070504; opacity:0; }
  #sc-title{ position:fixed; z-index:24; left:8vw; right:8vw; top:50%; transform:translateY(-50%);
    text-align:center; pointer-events:none; opacity:0; transition:opacity 1s ease;
    color:var(--gold); letter-spacing:.34em; font-size:clamp(15px,2.9vmin,28px);
    text-shadow:0 0 26px rgba(212,175,55,.42); }
  #sc-title.on{ opacity:1; }
  #sc-skip{ position:fixed; z-index:25; right:2.4vw; bottom:3vh; opacity:0; transition:opacity .6s ease;
    font-size:clamp(9px,1.35vmin,12px); letter-spacing:.2em; color:#7d7361; pointer-events:none; }
  #sc-skip.on{ opacity:1; }
  body.in-scene{ cursor:none; }
  @media (max-width:620px){ #shelf-col{ width:100vw; } #shelf-hint{ display:none; } }
</style>

<script>
/* THE HOST DRIVES THE OPENING. The shared engine boots the VOYAGE by itself;
   told there is a host, it raises the same world and then stands back. */
window.__HOST_BOOT=true;

window.__BOOTUI=(function(){
  var $=function(id){ return document.getElementById(id); };
  /* the loading screen reads scripture while the world is raised */
  var WORDS=[
    ['In the beginning Aluahim created the shamayim and the earth.','BERĔSHITH 1:1'],
    ['And the earth came to be formless and empty and darkness was on the face of the deep.','BERĔSHITH 1:2'],
    ['And Aluahim said, “Let light come to be,” and light came to be.','BERĔSHITH 1:3'],
    ['And Aluahim said, “Let the waters under the shamayim be gathered together into one place and let the dry land appear.”','BERĔSHITH 1:9'],
    ['And Aluahim made two great lights: the greater light to rule the day and the lesser light to rule the night and the stars.','BERĔSHITH 1:16'],
    ['And Aluahim created the man in His image, in the image of Aluahim He created him.','BERĔSHITH 1:27'],
    ['And on the seventh day Aluahim completed His work which He had done and He rested.','BERĔSHITH 2:2'],
    ['And (YAHUAH) HWHY Aluahim planted a garden in Ĕḏen, to the east and there He put the man whom He had formed.','BERĔSHITH 2:8'],
  ];
  var i=Math.floor(Math.random()*WORDS.length), timer=null;
  function setW(){ var w=WORDS[i%WORDS.length]; i++; $('bv-t').textContent=w[0]; $('bv-r').textContent=w[1]; }
  function turn(){ var e=$('bv-inner'); e.style.opacity=0;
    setTimeout(function(){ setW(); e.style.opacity=1; },500); }
  setW(); timer=setInterval(turn,5600);
  return {
    stage:function(label,frac){ var s=$('load-stage'), f=$('load-fill');
      if(s&&label!=null) s.textContent=label;
      if(f&&frac!=null) f.style.width=Math.round(Math.max(0,Math.min(1,frac))*100)+'%'; },
    fail:function(msg){ var e=$('load-fail'); if(e){ e.textContent=msg; e.style.display='block'; }
      var b=$('load-bar'); if(b) b.style.display='none';
      var s=$('load-stage'); if(s) s.textContent='the scroll could not be opened';
      if(timer){ clearInterval(timer); timer=null; } },
    done:function(){ if(timer){ clearInterval(timer); timer=null; } }
  };
})();
</script>

<!-- ============ THE SOCKETS THE SHARED ENGINE EXPECTS ============
     The engine is the VOYAGE's engine, and it reaches for the VOYAGE's HUD
     by name — the button rail, the clock, the compass rose, the log. This
     game shows none of that, but an engine that finds nothing where a
     button should be throws, and a thrown frame is a black screen.

     So every socket it reaches for is provided here, empty and unseen. They
     cost nothing, they are never shown, and they mean the shared engine can
     be updated for the voyage without ever having to know this game exists. -->
<div id="engine-sockets" aria-hidden="true"

<!-- ============ THE SHARED WORLD ============
     The very same earth, beasts, flora, cities and engine the VOYAGE is
     played on — loaded from where they already live, never copied. A fix
     made to the world lands in both games at once. -->
<script>
window.EARTH={list:[],verseList:[],riverList:[],cityList:[],landmarkList:[],deepList:[],holeList:[],sceneList:[],scrollList:[],beastList:[],faunaList:[],floraList:[],
  country:function(c){this.list.push(c);},
  verses:function(v){this.verseList=v;},
  river:function(r){this.riverList.push(r);},
  city:function(c){this.cityList.push(c);},
  landmark:function(l){this.landmarkList.push(l);},
  deep:function(d){this.deepList.push(d);},
  hole:function(h){this.holeList.push(h);},
  scene:function(s){this.sceneList.push(s);},
  scroll:function(s){this.scrollList.push(s);},
  beast:function(b){this.beastList.push(b);},
  fauna:function(f){this.faunaList.push(f);},
  flora:function(f){this.floraList.push(f);}};
</script>

<script>
/* ============ THE OPENING OF THIS GAME ============ */
(function(){
  var BUI=window.__BOOTUI;
  function fail(m){ BUI.fail(m); }
  function boot(){
    if(!(window.THREE&&window.__VOYAGE)){ fail('The engine of the world (three.js) could not be reached. Place three.min.js (r128) beside the main game and open this again.'); return; }
    BUI.stage('Kindling the engine of the world…',0.10);
    window.__VOYAGE();                       /* the shared world wakes, and stands back */
    loadStory();
  }
  function loadStory(){
    /* the stage, the story runner and the scrolls are loaded only once the
       engine is awake, because every one of them speaks to window.__WORLD */
    var files=['js/stage.js','js/story.js','scrolls/01-creation.js','scrolls/02-eden.js','js/unfold.js'];
    (function next(k){
      if(k>=files.length) return;
      var s=document.createElement('script'); s.src=files[k];
      s.onload=function(){ next(k+1); };
      s.onerror=function(){ fail('A scroll could not be opened: '+files[k]); };
      document.head.appendChild(s);
    })(0);
  }
  function tryLocal(){
    var l=document.createElement('script'); l.src='../three.min.js';
    l.onload=boot; l.onerror=function(){ fail('three.js could not be reached, and no offline copy was found beside the main game.'); };
    document.head.appendChild(l);
  }
  BUI.stage('Raising the firmament…',0.05);
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  s.onload=function(){ if(window.THREE) boot(); else tryLocal(); };
  s.onerror=tryLocal;
  document.head.appendChild(s);
})();
</script>
